[package]
name = "skv-analyzer"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
either = "1.15.0"
hex = "0.4.3"
llvm-ir = { path = "llvm-ir-patched", features = ["llvm-19"] }
sha2 = "0.10.9"
z3 = "0.20.0"

[build-dependencies]
cc = "1.1"
